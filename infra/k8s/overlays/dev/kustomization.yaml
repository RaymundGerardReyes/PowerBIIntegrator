apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namePrefix: dev-

patches:
  - target:
      kind: Deployment
      name: analytics-backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: ASPNETCORE_ENVIRONMENT
            value: "Development"
  - target:
      kind: Deployment
      name: analytics-frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
